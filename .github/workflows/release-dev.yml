name: Release (dev)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout releases repo
        uses: actions/checkout@v4
        with:
          repository: laihantao/pocket-gold-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          path: releases-repo

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/release-key.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../release-key.jks
          EOF

      - name: Resolve base version from pubspec
        id: version
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve commit notes since last dev build
        id: notes
        run: |
          # Diff against the SHA recorded in the last published manifest, so the
          # dialog shows what actually changed since the last dev build instead
          # of a single commit hash.
          OLD_SHA=$(python3 -c "
          import json
          try:
              print(json.load(open('releases-repo/release_manifests/version-dev.json')).get('commit_sha', ''))
          except FileNotFoundError:
              print('')
          " 2>/dev/null || true)

          if [ -n "$OLD_SHA" ] && git cat-file -e "$OLD_SHA" 2>/dev/null; then
            RANGE="$OLD_SHA..HEAD"
          else
            RANGE="-5"
          fi

          NOTES=$(git log $RANGE --pretty=format:'- %s' --no-merges \
            | grep -Ev '^- chore: update version-(dev|prod)\.json.*\[skip ci\]$' || true)
          if [ -z "$NOTES" ]; then
            NOTES="- ${GITHUB_SHA:0:7}"
          fi

          {
            echo "notes<<NOTES_EOF"
            echo "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - name: Build dev APK
        env:
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter build apk --flavor dev --target lib/main_dev.dart \
            --dart-define=CHANNEL=dev --release \
            --build-name="$BASE_VERSION" --build-number="$BUILD_NUMBER"

      - name: Create/update rolling dev-latest release
        uses: softprops/action-gh-release@v2
        with:
          repository: laihantao/pocket-gold-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: dev-latest
          name: "Dev build #${{ github.run_number }}"
          body: "Automated dev build from commit ${{ github.sha }}."
          prerelease: true
          files: build/app/outputs/flutter-apk/app-dev-release.apk

      - name: Update version-dev.json in releases repo
        env:
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
          BUILD_NUMBER: ${{ github.run_number }}
          REPO: laihantao/pocket-gold-releases
          SHA: ${{ github.sha }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          cd releases-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The checkout of this repo happened before the (multi-minute) build
          # step, so another run may have pushed to main in the meantime. Retry
          # with a hard reset onto the latest main instead of assuming our
          # checkout is still current — safe because the manifest content below
          # is fully regenerated from this run's own env vars each time.
          for attempt in 1 2 3 4 5; do
          python3 - <<'PYEOF'
          import json, os, datetime
          version = f'{os.environ["BASE_VERSION"]}-dev.{os.environ["BUILD_NUMBER"]}'
          data = {
              "version": version,
              "build_number": int(os.environ["BUILD_NUMBER"]),
              "apk_url": (
                  f'https://github.com/{os.environ["REPO"]}/releases/download/'
                  f'dev-latest/app-dev-release.apk'
              ),
              "notes": os.environ["NOTES"],
              "commit_sha": os.environ["SHA"],
              "force_update": False,
              "release_date": datetime.date.today().isoformat(),
          }
          os.makedirs("release_manifests", exist_ok=True)
          with open("release_manifests/version-dev.json", "w") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PYEOF

            git add release_manifests/version-dev.json
            if git diff --cached --quiet; then
              break
            fi
            git commit -m "chore: update version-dev.json build $BUILD_NUMBER [skip ci]"
            if git push origin main; then
              break
            fi
            echo "Push rejected (attempt $attempt/5), syncing with remote and retrying..."
            git fetch origin main
            git reset --hard origin/main
          done

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
          else
            EMOJI="❌"
          fi
          SHORT_SHA="${SHA:0:7}"
          DATETIME=$(date -u -d '+8 hours' +'%d %B %y, %-l:%M %p')

          MESSAGE=$(cat <<EOF
          🧪 <b>Pocket Gold — DEV Build #${RUN_NUMBER}</b>
          $EMOJI Status: ${STATUS^^}
          Branch: $BRANCH
          Revision: <a href="https://github.com/$REPO/commit/$SHA">$SHORT_SHA</a>
          DateTime: $DATETIME (UTC+8)
          Author: $ACTOR
          🔗 <a href="$RUN_URL">View run</a>
          EOF
          )

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MESSAGE}") || true
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Telegram notification failed (HTTP ${HTTP_CODE:-unknown})"
          fi
