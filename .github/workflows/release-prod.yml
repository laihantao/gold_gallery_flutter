name: Release (prod)

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout releases repo
        uses: actions/checkout@v4
        with:
          repository: laihantao/pocket-gold-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          path: releases-repo

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/release-key.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../release-key.jks
          EOF

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve release notes
        id: notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          NOTES=$(git tag -l --format='%(contents)' "$TAG")
          if [ -z "$NOTES" ]; then
            NOTES=$(git log -1 --pretty=%B)
          fi
          {
            echo "notes<<NOTES_EOF"
            echo "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - name: Build prod APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter build apk --flavor prod --target lib/main_prod.dart \
            --dart-define=CHANNEL=prod --release \
            --build-name="$VERSION" --build-number="$BUILD_NUMBER"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: laihantao/pocket-gold-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          files: build/app/outputs/flutter-apk/app-prod-release.apk

      - name: Update version-prod.json in releases repo
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ steps.notes.outputs.notes }}
          REPO: laihantao/pocket-gold-releases
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PYEOF'
          import json, os, datetime
          data = {
              "version": os.environ["VERSION"],
              "build_number": int(os.environ["BUILD_NUMBER"]),
              "apk_url": (
                  f'https://github.com/{os.environ["REPO"]}/releases/download/'
                  f'{os.environ["TAG"]}/app-prod-release.apk'
              ),
              "notes": os.environ["NOTES"],
              "force_update": False,
              "release_date": datetime.date.today().isoformat(),
          }
          os.makedirs("releases-repo/release_manifests", exist_ok=True)
          with open("releases-repo/release_manifests/version-prod.json", "w") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PYEOF
          cd releases-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release_manifests/version-prod.json
          git diff --cached --quiet || git commit -m "chore: update version-prod.json for $TAG [skip ci]"
          git push origin main
