name: Release (prod)

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout releases repo
        uses: actions/checkout@v4
        with:
          repository: laihantao/pocket-gold-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          path: releases-repo

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/release-key.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../release-key.jks
          EOF

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve release notes
        id: notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Primary source: the "## [<version>]" section of CHANGELOG.md, kept
          # up to date by hand (see CHANGELOG.md). Falls back to the tag
          # annotation, then the last commit message, for versions that
          # forgot to update it.
          NOTES=$(python3 - <<'PYEOF'
          import os, re

          version = os.environ["VERSION"]
          try:
              text = open("CHANGELOG.md", encoding="utf-8").read()
          except FileNotFoundError:
              text = ""

          m = re.search(
              rf'##\s*\[{re.escape(version)}\][^\n]*\n(.*?)(?=\n##\s*\[|\Z)',
              text,
              re.S,
          )
          print(m.group(1).strip() if m else "")
          PYEOF
          )
          if [ -z "$NOTES" ]; then
            NOTES=$(git tag -l --format='%(contents)' "$TAG")
          fi
          if [ -z "$NOTES" ]; then
            NOTES=$(git log -1 --pretty=%B)
          fi
          {
            echo "notes<<NOTES_EOF"
            echo "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - name: Build prod APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter build apk --flavor prod --target lib/main_prod.dart \
            --dart-define=CHANNEL=prod --release \
            --build-name="$VERSION" --build-number="$BUILD_NUMBER"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: laihantao/pocket-gold-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          files: build/app/outputs/flutter-apk/app-prod-release.apk

      - name: Update version-prod.json in releases repo
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ steps.notes.outputs.notes }}
          REPO: laihantao/pocket-gold-releases
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd releases-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The checkout of this repo happened before the (multi-minute) build
          # step, so another run (e.g. a concurrent dev build) may have pushed
          # to main in the meantime. Retry with a hard reset onto the latest
          # main instead of assuming our checkout is still current — safe
          # because the manifest content below is fully regenerated from this
          # run's own env vars each time.
          for attempt in 1 2 3 4 5; do
          python3 - <<'PYEOF'
          import json, os, datetime
          data = {
              "version": os.environ["VERSION"],
              "build_number": int(os.environ["BUILD_NUMBER"]),
              "apk_url": (
                  f'https://github.com/{os.environ["REPO"]}/releases/download/'
                  f'{os.environ["TAG"]}/app-prod-release.apk'
              ),
              "notes": os.environ["NOTES"],
              "force_update": False,
              "release_date": datetime.date.today().isoformat(),
          }
          os.makedirs("release_manifests", exist_ok=True)
          with open("release_manifests/version-prod.json", "w") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PYEOF

            git add release_manifests/version-prod.json
            if git diff --cached --quiet; then
              break
            fi
            git commit -m "chore: update version-prod.json for $TAG [skip ci]"
            if git push origin main; then
              break
            fi
            echo "Push rejected (attempt $attempt/5), syncing with remote and retrying..."
            git fetch origin main
            git reset --hard origin/main
          done

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
          SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
          else
            EMOJI="❌"
          fi
          SHORT_SHA="${SHA:0:7}"
          DATETIME=$(date -u -d '+8 hours' +'%d%m%y, %H%M')

          MESSAGE=$(cat <<EOF
          🚀 <b>Pocket Gold — PROD Release ${RELEASE_TAG}</b>
          $EMOJI Status: ${STATUS^^}
          Tag: $RELEASE_TAG
          Revision: <a href="https://github.com/$REPO/commit/$SHA">$SHORT_SHA</a>
          DateTime: $DATETIME (UTC+8)
          Author: $ACTOR
          🔗 <a href="$RUN_URL">View run</a>
          EOF
          )

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MESSAGE}") || true
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Telegram notification failed (HTTP ${HTTP_CODE:-unknown})"
          fi
